{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Weather App</title>

        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>

    {% if exception_occurred %}
    <body class="error-weather">
    {% else %}
    <body class="normal-weather">
    {% endif %}

        <div class="container">
            <h1>Weather App</h1>
            <form method="POST">
                {% csrf_token %}
                <input
                    type="text"
                    name="city"
                    placeholder="Enter City"
                    value="{{ city }}">

                <button type="submit">Search</button>
            </form>

            <div class="weather">
                <div class="left">
                    <h2>{{ temp }}&#176; C</h2>
                    <h3>{{ city }}</h3>
                </div>

                <div class="right">
                    <div class="icon">
                        <p>
                           <img
                                src="https://openweathermap.org/img/wn/{{ icon }}@2x.png"
                                width="100px"
                                alt="Weather icon">
                        </p>
                    </div>

                    <div class="condition">
                        <p>{{ description }}</p>
                        <p>{{ day }}</p>
                    </div>
                </div>
            </div>
        </div>

        {% if exception_occurred %}
        <script>
            window.onload = function() {
                alert(
                    "Error fetching weather data for '{{ city }}'. " +
                    "Showing weather data for 'Hyderabad' instead."
                );
            }
        </script>

        {% endif %}

    </body>
</html>
